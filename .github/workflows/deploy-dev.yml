# Deploy env `dev` on every push to develop (BE-26 / CAR-3784). PRs are checked by ci.yml, not here.
# Order matters: build -> D1 migrations -> deploy. The steps are separate and none uses
# `continue-on-error`, so a failing migration stops the job before `wrangler deploy` runs.
name: deploy-dev

on:
  push:
    branches:
      - develop

# One deploy at a time. Not cancelled mid-run: killing `d1 migrations apply` or `wrangler deploy` half way is
# worse than waiting; GitHub keeps only the newest queued run, so a burst of merges still ends on the latest.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: deploy dev
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # GitHub Environment `dev` (no required reviewers)
    environment: dev
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # builds apps/client first (apps/worker depends on it): wrangler.jsonc serves ../client/dist
      - run: pnpm build

      # BE-37 / CAR-3789: content-hashed assets -> R2 (only files the bucket does not have yet), then
      # manifest.json into the client build that `wrangler deploy` serves. Runs BEFORE migrations / deploy:
      # an upload only adds files nobody references yet, so a failure later leaves nothing half-switched, and a
      # failure here (bad token, bucket missing, CORS wrong) stops the job before anything else changes.
      - name: Sync assets to R2 (dev)
        shell: bash
        run: node scripts/upload-assets.ts sync --bucket "$R2_BUCKET" --out apps/client/dist/manifest.json
        env:
          R2_BUCKET: booberman-assets-dev
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # overwrites the bucket's CORS rules with r2-cors.dev.json each run (idempotent), so the file is the truth
      - name: Apply R2 CORS (dev)
        working-directory: apps/worker
        run: pnpm exec wrangler r2 bucket cors set "$R2_BUCKET" --file ../../r2-cors.dev.json --force
        env:
          R2_BUCKET: booberman-assets-dev
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # what a browser sees: every file in manifest.json has the immutable Cache-Control + CORS for the game
      # origin. GitHub Environment variable ASSETS_PUBLIC_URL = public base URL of the bucket (not a secret).
      - name: Check public asset headers (dev)
        shell: bash
        run: node scripts/upload-assets.ts verify --manifest apps/client/dist/manifest.json --base-url "$ASSETS_PUBLIC_URL" --origin "$GAME_ORIGIN"
        env:
          ASSETS_PUBLIC_URL: ${{ vars.ASSETS_PUBLIC_URL }}
          GAME_ORIGIN: https://booberman-dev.miryn.workers.dev

      - name: Apply D1 migrations (dev)
        working-directory: apps/worker
        run: pnpm exec wrangler d1 migrations apply DB --env dev --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker (dev)
        id: deploy
        working-directory: apps/worker
        shell: bash
        run: |
          pnpm exec wrangler deploy --env dev 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          url="$(grep -Eo 'https://booberman-dev\.[A-Za-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -n 1 || true)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test /api/health
        shell: bash
        run: |
          if [ -z "$URL" ]; then echo "::error::could not find the workers.dev URL in the deploy output"; exit 1; fi
          echo "dev: $URL" >> "$GITHUB_STEP_SUMMARY"
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors "$URL/api/health"
        env:
          URL: ${{ steps.deploy.outputs.url }}
