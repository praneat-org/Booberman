<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1b1b2f" />
    <title>Booberman</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #1b1b2f;
        overflow: hidden;
      }
      /* column: the room bar (FE-19) is inserted above #app and the canvas fits what is left */
      body {
        display: flex;
        flex-direction: column;
      }
      #app {
        flex: 1 1 0;
        min-height: 0;
        width: 100%;
        background: #1b1b2f;
        overflow: hidden;
      }
      canvas {
        image-rendering: pixelated;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
